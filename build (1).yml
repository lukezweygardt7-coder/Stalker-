name: Build Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # No gradlew binary is committed (it's a binary file this workflow
      # can't generate for you), so Gradle itself is installed and used
      # directly. This avoids needing a gradle-wrapper.jar in the repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Build mod jar
        run: gradle build --no-daemon --stacktrace

      - name: Upload built jar(s)
        uses: actions/upload-artifact@v4
        with:
          name: stalker-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
